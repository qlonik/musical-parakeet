---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter
spec:
  chartRef:
    kind: OCIRepository
    name: matter
  interval: 1h
  values:
    controllers:
      matter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: 8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
            args:
              # prettier-ignore
              [
                "--storage-path", "/data",
                "--paa-root-cert-dir", "/data/credentials",
                "--bluetooth-adapter", "0",
                "--port", "35580",
                "--log-level-sdk", "progress",
                "--primary-interface", "bond0",
              ]
            env:
              TZ: ${TIMEZONE}
            ports:
              - name: http
                containerPort: 35580
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              # Needed for Bluetooth via dbus
              appArmorProfile: { type: Unconfined }
    defaultPodOptions:
      hostNetwork: true
      nodeSelector:
        # only this host has bluetooth
        kubernetes.io/hostname: andromeda
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: matter
        ports:
          http:
            port: 5580
            targetPort: http
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: matter
          gethomepage.dev/icon: sh-matter.svg
          gethomepage.dev/description: Matter server
          gethomepage.dev/group: Various
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.default.svc.cluster.local:5580"
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: matter
        globalMounts:
          - path: /data
      run-dbus: # Needed for Bluetooth via dbus
        type: hostPath
        hostPath: /run/dbus
        globalMounts:
          - readOnly: true
      etc-localtime:
        type: hostPath
        hostPath: /etc/localtime
        globalMounts:
          - readOnly: true
      tmp:
        type: emptyDir
      app-updates:
        type: emptyDir
        globalMounts:
          - path: /app/updates
