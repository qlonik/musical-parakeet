---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster-16
      namespace: database
    - name: glauth
      namespace: default
    - name: maddy
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/mealie/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
