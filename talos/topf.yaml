---
clusterName: kubernetes
clusterEndpoint: https://192.168.0.79:6443

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.0
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.1

secretsPath: secrets.sops.yaml

nodes:
  - host: "andromeda"
    ip: "192.168.0.50"
    role: control-plane
    schematicId: "@node/schematic.andromeda.yaml"
    data:
      installDisk: "/dev/nvme0n1"
      installDiskSerial: ""
      iface: enp0s31f6
      macAddr: "34:97:f6:a3:41:d0"
      mtu: 1500
      encryptDisk: false
      kernelModules: []
  - host: "talos-node-1"
    ip: "192.168.0.49"
    role: worker
    schematicId: "@node/schematic.talos-node-1.yaml"
    data:
      installDisk: "/dev/vda"
      installDiskSerial: ""
      iface: ens3
      macAddr: "00:a0:98:0c:2e:ed"
      mtu: 1500
      encryptDisk: false
      kernelModules: []
