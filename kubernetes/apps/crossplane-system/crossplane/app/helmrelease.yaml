---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
spec:
  chartRef:
    kind: OCIRepository
    name: crossplane
  interval: 1h
  values:
    function:
      packages:
        - xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.10.3
    provider:
      packages:
        - ghcr.io/vshn/provider-minio:v0.4.5
