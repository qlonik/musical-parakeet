---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: "firefly-iii-data-importer-${user_id}"
spec:
  chartRef:
    kind: OCIRepository
    name: "firefly-iii-data-importer-${user_id}"
  dependsOn:
    - name: firefly-iii
      namespace: default
  interval: 1h
  values:
    controllers:
      main:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: fireflyiii/data-importer
              tag: version-2.3.5@sha256:2627644321afdcb52b49b258126bfe98312c2f93a709cc3a07c90327854e6aa2
            env:
              TZ: ${TIMEZONE}
              FIREFLY_III_URL: http://firefly-iii.default.svc.cluster.local:8080
              VANITY_URL: "https://firefly-iii.${SECRET_DOMAIN}"
              FIREFLY_III_ACCESS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: firefly-iii-data-importer-resources
                    key: "${user_id}-pat"
              TRUSTED_PROXIES: "**"
              EXPECT_SECURE_URL: "true"
              REDIS_HOST: http://redis-lb.database.svc.cluster.local
              REDIS_PORT: 6379
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: firefly-iii-data-importer-resources
                    key: redis-password
              REDIS_DB: 15
              REDIS_CACHE_DB: 16
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 500Mi
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        primary: true
        controller: main
        ports:
          http:
            primary: true
            port: *port
