---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authelia
      namespace: default
    - name: cloudnative-pg-cluster-16
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 1Gi
      PVC_NAME_SUFFIX: "-uploads"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
#
#
#
#
#
# data importer setup
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii-data-importer-resources
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii/data-importer/resources
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii-data-importer-user-01
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authelia
      namespace: default
    - name: firefly-iii
      namespace: default
    - name: firefly-iii-data-importer-resources
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii/data-importer/template
  postBuild:
    substitute:
      user_id: user-01
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii-data-importer-user-02
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authelia
      namespace: default
    - name: firefly-iii
      namespace: default
    - name: firefly-iii-data-importer-resources
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii/data-importer/template
  postBuild:
    substitute:
      user_id: user-02
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    substitution.flux.home.arpa/disabled: "true"
  name: &app firefly-iii-data-importer-ingress
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: firefly-iii
      namespace: default
    - name: firefly-iii-data-importer-resources
      namespace: default
    - name: firefly-iii-data-importer-user-01
      namespace: default
    - name: firefly-iii-data-importer-user-02
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii/data-importer/ingress
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: cluster-settings-user
        optional: true
      - kind: Secret
        name: cluster-secrets-user
        optional: true
      - kind: Secret
        name: firefly-iii-data-importer-substitutions
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
