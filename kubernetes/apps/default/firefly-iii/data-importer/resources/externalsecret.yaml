---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-iii-data-importer-resources
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: store-k8s
  target:
    name: firefly-iii-data-importer-resources
    template:
      engineVersion: v2
      data:
        redis-password: "{{ .redis_pass }}"
        user-01-pat: "{{ .user_001_firefly_iii_pat }}"
        user-02-pat: "{{ .user_002_firefly_iii_pat }}"
  dataFrom:
    - extract:
        key: everything
    - extract:
        key: users
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-iii-data-importer-substitutions
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: store-k8s
  target:
    name: firefly-iii-data-importer-substitutions
    template:
      engineVersion: v2
      data:
        user_01_username: "{{ .user_001_name }}"
        user_02_username: "{{ .user_002_name }}"
  dataFrom:
    - extract:
        key: users
