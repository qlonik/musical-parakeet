---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cross-seed
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: prowlarr
      namespace: default
    - name: qbittorrent
      namespace: default
    - name: radarr
      namespace: default
    - name: sonarr
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/cross-seed/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  wait: true
