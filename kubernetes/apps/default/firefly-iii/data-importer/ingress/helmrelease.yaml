---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii-data-importer-ingress
spec:
  chartRef:
    kind: OCIRepository
    name: firefly-iii-data-importer-ingress
  dependsOn:
    - name: firefly-iii-data-importer-user-01
      namespace: default
    - name: firefly-iii-data-importer-user-02
      namespace: default
  interval: 1h
  values:
    controllers:
      firefly-iii-data-importer-ingress:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: stable-alpine@sha256:c715a16970095e90787b02edd68b6371e24c18b8cc905ab1cd17cb20f79816fe
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probes-spec
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  <<: *probes-spec
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 50Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        primary: true
        controller: firefly-iii-data-importer-ingress
        ports:
          http:
            primary: true
            port: *port
    ingress:
      main:
        className: internal
        annotations:
          auth.home.arpa/enabled: "true"
        hosts:
          - host: &host "data-importer.${SECRET_DOMAIN}"
            paths:
              - path: "/"
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        type: configMap
        name: firefly-iii-data-importer-ingress-config
        globalMounts:
          - path: /etc/nginx/conf.d/data-importer.conf
            subPath: data-importer.conf
            readOnly: true
