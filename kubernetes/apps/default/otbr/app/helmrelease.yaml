---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
spec:
  chartRef:
    kind: OCIRepository
    name: otbr
  interval: 1h
  values:
    controllers:
      otbr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/ownbee/hass-otbr-docker
              tag: v0.4.0@sha256:790f21835c86e0d9b9071f21b042ca77ef0ff70e714e8454903982a00df83cfb
            env:
              TZ: ${TIMEZONE}
              BACKBONE_IF: bond0
              DEVICE: "/tmp/ttyOTBR"
              NETWORK_DEVICE: slzb-mrw10.home.arpa:7638
              BAUDRATE: "460800"
              FLOW_CONTROL: "0"
              FIREWALL: "1"
              NAT64: "1"
              # THREAD_1_4: "1"
              AUTOFLASH_FIRMWARE: "0"
              OTBR_WEB: "1"
              OTBR_WEB_PORT: "37586"
              OTBR_REST_PORT: "38081"
              OTBR_LOG_LEVEL: debug
            ports:
              - name: api
                containerPort: 38081
              - name: http
                containerPort: 37586
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
                squat.ai/tun: "1"
            securityContext:
              privileged: true
              capabilities:
                drop: ["ALL"]
                add: ["SYS_ADMIN", "NET_ADMIN"]
    defaultPodOptions:
      hostNetwork: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: otbr
        ports:
          http:
            port: 7586
            targetPort: http
          api:
            port: 8081
            targetPort: api
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: otbr
          gethomepage.dev/icon: sh-matter.svg
          gethomepage.dev/description: OpenThread Border Router
          gethomepage.dev/group: Various
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.default.svc.cluster.local:7586"
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: otbr
        globalMounts:
          - path: /data/thread
      dev-net-tun:
        type: hostPath
        hostPath: /dev/net/tun
