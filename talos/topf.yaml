---
clusterName: kubernetes
clusterEndpoint: https://192.168.0.79:6443

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.2
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.0

secretsPath: secrets.sops.yaml

nodes:
  - host: "andromeda"
    ip: "192.168.0.50"
    role: control-plane
    schematicId: "@node/schematic.andromeda.yaml"
    data:
      installDisk: "/dev/nvme0n1"
      installDiskSerial: ""
      useForLonghorn: true
      systemDiskSizeGiB: 1024
      iface: enp0s31f6
      macAddr: "34:97:f6:a3:41:d0"
      mtu: 1500
      encryptDisk: false
      kernelModules: []
  - host: "bruxoo"
    ip: "192.168.0.51"
    role: worker
    schematicId: "@node/schematic.bruxoo.yaml"
    data:
      installDisk: "/dev/sda"
      installDiskSerial: ""
      useForLonghorn: true
      systemDiskSizeGiB: 256
