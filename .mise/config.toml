min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

# Venv - compat for now
_.path = ["{{config_root}}/.venv/bin"]
VIRTUAL_ENV = "{{config_root}}/.venv"
PYTHONDONTWRITEBYTECODE = "1"

# Ansible - compat for now
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/.venv/galaxy"
ANSIBLE_ROLES_PATH = "{{config_root}}/.venv/galaxy/ansible_roles"
ANSIBLE_VARS_ENABLED = "host_group_vars,community.sops.sops"
ANSIBLE_LOCALHOST_WARNING = "false"
ANSIBLE_INVENTORY_UNPARSED_WARNING = "false"

[tools]
age = "1.3.2"
cloudflared = "2026.10.5"
flux2 = "2.10.0"
gh = "2.103.3"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "24.22.2"
oxfmt = "0.67.0"
pre-commit = "4.7.0"
prettier = "3.9.10"
sops = "3.13.3"
stern = "1.35.0"
talosctl = "1.14.0"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.1"
zizmor = "1.31.1"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[hooks]
postinstall = "lefthook install"
