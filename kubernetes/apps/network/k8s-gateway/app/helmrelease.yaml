---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.0.80"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service"]
    fallthrough:
      enabled: true
      zones:
        - ${SECRET_DOMAIN}
    extraZonePlugins:
      - name: log
      - name: loop
      - name: reload
      - name: loadbalance
      - name: errors
      - # Serves a /health endpoint on :8080, required for livenessProbe
        name: health
        configBlock: |
          lameduck 5s
      - # Serves a /ready endpoint on :8181, required for readinessProbe
        name: ready
      - # Serves a /metrics endpoint on :9153, required for serviceMonitor
        name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        # Enabling TLS using `tls://` is required here to prevent AdGuard from
        # intercepting and responding to plaintext DNS queries.
        parameters: . tls://1.1.1.1 tls://1.0.0.1
